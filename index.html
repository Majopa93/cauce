<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filtros por paciente · RenalVida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122a30; --ink-soft:#4c626a; --ink-faint:#8aa0a6;
  --b1:#17c6f3; --b2:#26cde0; --b3:#57debc;
  --grad:linear-gradient(120deg,#17c6f3 0%,#26cde0 46%,#57debc 100%);
  --brand-050:#e6f7fd; --brand-ink:#0b7fa0; --teal-050:#eef8fb; --teal-100:#d2edf3;
  --porcelain:#eef3f4; --card:#ffffff; --line:#dbe6e8; --line-soft:#e9f0f1;
  --ok:#1f9e79; --ok-bg:#dcf5ee; --amber:#a9741a; --amber-bg:#f8efd8; --red:#b03526; --red-bg:#f7e3df;
  --shadow:0 1px 2px rgba(18,42,48,.05),0 8px 24px -12px rgba(18,42,48,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--porcelain);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;line-height:1.15}

.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top img{height:36px;display:block}
.top .tt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;border-left:1px solid var(--line);padding-left:20px}
.top .sp{flex:1}
.msel{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.msel .dot{width:7px;height:7px;border-radius:50%;background:var(--b2)}
.msel select{border:none;background:none;font:inherit;font-weight:600;color:var(--ink);outline:none;cursor:pointer}
.addm{background:var(--brand-050);color:var(--brand-ink);border:none;font:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer}
.addm:hover{background:var(--teal-100)}
.savebtn{display:none;background:var(--grad);color:#083540;border:none;font:inherit;font-weight:700;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer}
.savebtn.show{display:inline-block}
.savebtn.dirty{box-shadow:0 0 0 3px var(--brand-050);animation:pulseg 1.6s ease-in-out infinite}
@keyframes pulseg{0%,100%{box-shadow:0 0 0 3px var(--brand-050)}50%{box-shadow:0 0 0 6px var(--brand-050)}}
.pullbtn{display:none;background:var(--brand-050);color:var(--brand-ink);border:none;font:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer}
.pullbtn.show{display:inline-block}.pullbtn:hover{background:var(--teal-100)}
.tchips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.chlbl{font-size:12px;font-weight:600;color:var(--ink-faint)}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink-soft);font:inherit;font-weight:600;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.syncp{font-size:12px;font-weight:600;color:var(--ink-faint);white-space:nowrap}
.syncp.ok{color:var(--ok)}.syncp.save{color:var(--amber)}.syncp.err{color:var(--red)}
.syncp.ok::before,.syncp.save::before,.syncp.err::before{content:"\25cf  "}

.wrap{max-width:1200px;margin:0 auto;padding:22px 24px 70px}
.tabs{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);color:var(--ink-soft);font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vtog{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.vtog button{border:none;background:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 15px;cursor:pointer;color:var(--ink-soft)}
.vtog button.on{background:var(--grad);color:#083540}

.ex-banner{display:flex;align-items:center;gap:10px;background:var(--teal-050);border:1px solid var(--teal-100);color:var(--brand-ink);border-radius:12px;padding:11px 16px;font-size:13.5px;margin-bottom:16px}
.ex-banner svg{width:18px;height:18px;flex-shrink:0}

.totbar{position:sticky;top:66px;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:860px){.totbar{grid-template-columns:repeat(2,1fr)}.top .tt{display:none}.top{padding:12px 14px;gap:12px}.wrap{padding:16px 12px 60px}}
@media(max-width:720px){
  .top{position:static}
  .totbar{position:static;top:auto;grid-template-columns:repeat(2,1fr)}
  .sala,.sala tbody{display:block}
  .sala thead{display:none}
  .sala tr{display:block;border:1px solid var(--line);border-radius:13px;margin:10px 0;padding:10px 13px 6px;position:relative;box-shadow:var(--shadow)}
  .sala td{display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;border-bottom:1px solid var(--line-soft);padding:8px 0}
  .sala td:last-child{border-bottom:none}
  .sala td::before{content:attr(data-l);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint)}
  .sala td.hidem{display:flex}
  .sala td.num{position:absolute;top:10px;right:13px;padding:0;border:none;color:var(--ink-faint);font-size:11px}
  .sala td.num::before{content:""}
  .sala td.nmcell{border-bottom:1px solid var(--line);padding:2px 46px 8px 0}
  .sala td.nmcell::before{content:""}
  .sala td.nmcell .nm{font-weight:700;font-size:15px;width:100%;border-color:transparent}
  .sala td.delcell{justify-content:flex-end;padding-top:4px}
  .sala td.delcell::before{content:""}
  .sala td.delcell .delx{font-size:13px;color:var(--red)}
  .stp input{width:40px}
}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow)}
.tcard .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.tcard .v{font-family:"Bricolage Grotesque";font-weight:700;font-size:23px;margin-top:2px}
.tcard .s{font-size:11.5px;color:var(--ink-soft)}
.tcard.cuad.ok{background:var(--ok-bg);border-color:#bfe9da}.tcard.cuad.ok .v{color:#0e4635}
.tcard.cuad.bad{background:var(--amber-bg);border-color:#ecdcb0}.tcard.cuad.bad .v{color:#5e3f0c}

.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn-ghost{background:var(--brand-050);color:var(--brand-ink);border:none;font:inherit;font-weight:600;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn-ghost:hover{background:var(--teal-100)}
.hint{font-size:12.5px;color:var(--ink-faint)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
/* CONTEO table */
table.sala{width:100%;border-collapse:collapse}
.sala th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.sala td{padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
.sala tr:last-child td{border-bottom:none}
.sala .num{color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:12px;width:30px}
.sala input.nm{border:1px solid transparent;border-radius:7px;padding:5px 7px;font:inherit;font-size:13.5px;font-weight:500;width:100%;min-width:150px;background:transparent}
.sala input.nm:hover{border-color:var(--line-soft)} .sala input.nm:focus{border-color:var(--b1);outline:none;background:#fff;box-shadow:0 0 0 3px var(--brand-050)}
.segtog,.ptog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.segtog button,.ptog button{border:none;background:#fff;font:inherit;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;color:var(--ink-faint);white-space:nowrap}
.segtog button.on{background:var(--brand-ink);color:#fff}
.ptog button.on{background:var(--ink);color:#fff}
.fsel{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;font-weight:600;font-family:"IBM Plex Mono",monospace;background:#fff;cursor:pointer;color:var(--ink)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stp button{border:none;background:var(--porcelain);color:var(--ink);font:inherit;font-size:16px;font-weight:600;width:30px;height:32px;cursor:pointer;line-height:1}
.stp button:hover{background:var(--teal-100);color:var(--brand-ink)}
.stp input{border:none;width:46px;height:32px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;outline:none;background:#fff;color:var(--ink);-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp.sm button{width:26px;height:28px;font-size:14px}.stp.sm input{width:36px;height:28px;font-size:13px}
.fcell{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--brand-ink)}
.coagf{color:var(--amber);font-weight:600;font-size:11px}
.delx{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.delx:hover{background:var(--red-bg);color:var(--red)}
@media(max-width:860px){.sala .hidem{display:none}}

/* DÍA A DÍA cards */
.pcard{border-bottom:1px solid var(--line-soft);padding:13px 16px}
.pcard:last-child{border-bottom:none}
.pc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.pc-num{color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:12px}
.pc-name{font-weight:600;font-size:14px;flex:1;min-width:140px}
.pc-sig{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--brand-ink);font-size:14px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.i{background:var(--teal-050);color:var(--brand-ink)}.badge.m{background:var(--porcelain);color:var(--ink-soft)}
.dstrip{display:flex;flex-wrap:wrap;gap:5px}
.dcell{min-width:32px;height:34px;padding:0 4px;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;user-select:none;position:relative}
.dcell .dn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);line-height:1}
.dcell .dw{font-size:8px;letter-spacing:.03em;color:var(--ink-faint);text-transform:uppercase}
.dcell.on{background:var(--brand-ink);border-color:var(--brand-ink)}
.dcell.on .dn,.dcell.on .dw{color:#fff}
.dcell.coag{background:var(--amber);border-color:var(--amber)}
.dcell.coag .dn,.dcell.coag .dw{color:#fff}
.dcell.coag::after{content:"C";position:absolute;top:-6px;right:-5px;background:#fff;color:var(--amber);font-size:9px;font-weight:800;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border:1px solid var(--amber)}
.cmenu{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -8px rgba(18,42,48,.3);padding:11px;width:206px}
.cmenu .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:0 0 7px}
.cmenu .mf{display:flex;gap:6px;margin-bottom:8px}
.cmenu .fbtn{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font:inherit;font-weight:700;font-size:13px;cursor:pointer;font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.cmenu .fbtn.on{background:var(--brand-ink);color:#fff;border-color:var(--brand-ink)}
.cmenu .mf2{display:flex;gap:6px}
.cmenu .mbtn{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font:inherit;font-weight:600;font-size:12px;cursor:pointer}
.cmenu .mbtn.cg{color:var(--amber)}.cmenu .mbtn.cg.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.cmenu .mbtn.dl{color:var(--red)}.cmenu .mbtn.dl:hover{background:var(--red-bg)}
.dlegend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);padding:12px 16px;flex-wrap:wrap}
.dk{display:inline-flex;align-items:center;gap:6px}
.dkbox{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}

/* INFORME */
.informe{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-width:720px;margin:0 auto;padding:34px 40px 30px}
.inf-head{text-align:center;margin-bottom:22px}
.inf-ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-ink);font-weight:700}
.inf-head h2{font-size:22px;margin:6px 0 2px}.inf-head .d{color:var(--ink-soft);font-size:13px}
.itbl{width:100%;border-collapse:collapse;margin:14px 0}
.itbl caption{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-ink);font-weight:700;padding-bottom:7px}
.itbl th,.itbl td{padding:9px 10px;font-size:13.5px;border-bottom:1px solid var(--line-soft);text-align:left}
.itbl th{color:var(--ink-faint);font-weight:600;font-size:11.5px;text-transform:uppercase}
.itbl td.r,.itbl th.r{text-align:right;font-family:"IBM Plex Mono",monospace}
.itbl tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
.cuadre{margin:8px 0;border-radius:12px;padding:13px 16px;display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.cuadre svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.cuadre.ok{background:var(--ok-bg);color:#155e48}.cuadre.ok b{color:#0e4635}
.cuadre.bad{background:var(--amber-bg);color:#7a5414}.cuadre.bad b{color:#5e3f0c}
.inf-note{font-size:12px;color:var(--ink-soft);margin-top:8px}
.sign{display:flex;gap:40px;margin-top:40px}.sign-b{flex:1;text-align:center}
.sign-line{border-top:1px solid var(--ink-soft);margin-bottom:6px}
.sign-n{font-weight:600;font-size:13.5px}.sign-r{font-size:11.5px;color:var(--ink-soft)}
.printbtn{display:block;margin:18px auto 0;background:var(--grad);color:#083540;border:none;font:inherit;font-weight:700;font-size:14px;padding:11px 22px;border-radius:11px;cursor:pointer;box-shadow:var(--shadow)}
.foot{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:26px}
@media print{body{background:#fff}.top,.tabs,.printbtn,.foot,.totbar,.actions,.ex-banner{display:none}.informe{box-shadow:none;border:none;max-width:none}.wrap{padding:0}}
</style></head>

  const dia=diaI+diaM,consumidos=f[17]+f[18]+f[19]+f[20]+f[21];

    <td data-l="Sesiones"><span class="stp"><button onclick="bumpSes(${i},-1)">−</button><input type="number" min="0" value="${s}" onchange="setSesCount(${i},this.value)"><button onclick="bumpSes(${i},1)">+</button></span></td>
    <td class="hidem" data-l="Coag."><span class="stp sm"><button onclick="bumpCoag(${i},-1)">−</button><input type="number" min="0" value="${c}" onchange="setCoagCount(${i},this.value)"><button onclick="bumpCoag(${i},1)">+</button></span></td>
    <td class="fcell" data-l="Filtros" id="sig-${i}">${s+c} <span class="coagf">${c?("+"+c+" coag"):""}</span></td>
    <td class="delcell"><button class="delx" title="Quitar" onclick="delP(${i})">×</button></td></tr>`;}).join("");
  return `${exBanner()}<div id="totbar"></div>${turnoChips()}
    <div class="actions"><button class="btn-ghost" onclick="addP()">+ Paciente</button>
      <span class="hint">Escribe el total de <b>sesiones</b> de cada paciente; el filtro se cuenta por su tipo.</span></div>
    <div class="card"><table class="sala"><thead><tr>
      <th>Nº</th><th>Paciente</th><th>Seguro</th><th class="hidem">Patrón</th><th class="hidem">Turno</th><th>Filtro</th><th>Sesiones</th><th class="hidem">Coag.</th><th>Filtros</th><th></th>
    </tr></thead><tbody id="salabody">${rows}</tbody></table></div>`;
}

/* ---- DÍA A DÍA ---- */
function viewDia(){const x=D.months[MES];
  const cards=x.pac.map((p,i)=>({p:p,i:i})).filter(o=>matchTurno(o.p)).map(o=>{const p=o.p,i=o.i;const pd=patternDays(MES,p.patron);const s=sesOf(p),c=coagOf(p);
    const cells=pd.map(d=>{const v=p.dias[d.date];const cls=v?(v.c?"coag":"on"):"";
      return `<div class="dcell ${cls}" data-wl="${WLET[d.wd]}" title="${d.date}" onclick="tapDay(event,${i},'${d.date}')"><span class="dn">${d.d}</span><span class="dw">${v?v.f:WLET[d.wd]}</span></div>`;}).join("");
    return `<div class="pcard" id="pc-${i}"><div class="pc-head">
      <span class="pc-num">${String(i+1).padStart(2,"0")}</span>
      <span class="badge ${p.seg==="IESS"?"i":"m"}">${p.seg}</span>
      <span class="pc-name">${p.n}</span>
      <span class="ptog"><button class="${p.patron==="LMV"?"on":""}" onclick="setPat(${i},'LMV')">L-M-V</button><button class="${p.patron==="MJS"?"on":""}" onclick="setPat(${i},'MJS')">M-J-S</button></span>
      ${turnoSel(i,p)}
      <select class="fsel" onchange="setF(${i},this.value)">${[17,18,19,20,21].map(f=>`<option value="${f}" ${+p.filtro===f?"selected":""}>${f}H</option>`).join("")}</select>
      <span class="pc-sig" id="sig-${i}">${s+c} filtros</span></div>
      <div class="dstrip">${cells}</div></div>`;}).join("");
  return `${exBanner()}<div id="totbar"></div>${turnoChips()}
    <div class="actions"><button class="btn-ghost" onclick="addP()">+ Paciente</button>
      <span class="hint">Toca un día para marcar que dializó (filtro habitual). Tócalo otra vez para cambiar el filtro de esa sesión, marcar coágulo o quitar.</span></div>
    <div class="card">${cards}
      <div class="dlegend">
        <span class="dk"><span class="dkbox"></span> no dializó</span>
        <span class="dk"><span class="dkbox" style="background:var(--brand-ink);border-color:var(--brand-ink)"></span> dializó (nº = filtro usado)</span>
        <span class="dk"><span class="dkbox" style="background:var(--amber);border-color:var(--amber)"></span> coagulado (2 filtros)</span>
      </div></div>`;
}
function tapDay(ev,i,date){const p=D.months[MES].pac[i];p.dias=p.dias||{};
  if(!p.dias[date]){p.dias[date]={f:+p.filtro,c:0};save();repaintCell(i,date);updSig(i);drawTot();}
  else{openCellMenu(i,date,ev.currentTarget);}}
function repaintCell(i,date){const cell=document.querySelector(`#pc-${i} .dcell[title="${date}"]`);if(!cell)return;
  const v=D.months[MES].pac[i].dias[date];cell.className="dcell"+(v?(v.c?" coag":" on"):"");
  cell.querySelector(".dw").textContent=v?v.f:cell.dataset.wl;}
let MENU=null;
function openCellMenu(i,date,cellEl){closeMenu();const v=D.months[MES].pac[i].dias[date];
  const m=document.createElement("div");m.className="cmenu";m.id="cmenu";
  m.innerHTML=`<div class="lbl">Filtro del día ${+date.slice(8)}</div>
    <div class="mf">${[17,18,19,20,21].map(f=>`<button class="fbtn ${v&&v.f===f?"on":""}" onclick="setDayF(${i},'${date}',${f})">${f}H</button>`).join("")}</div>
    <div class="mf2"><button class="mbtn cg ${v&&v.c?"on":""}" onclick="toggleDayCoag(${i},'${date}')">Coaguló</button>
      <button class="mbtn dl" onclick="clearDay(${i},'${date}')">Quitar</button></div>`;
  document.body.appendChild(m);const r=cellEl.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(r.left+scrollX,scrollX+innerWidth-214))+"px";
  m.style.top=(r.bottom+scrollY+6)+"px";MENU={i,date,cellEl};
  setTimeout(()=>document.addEventListener("mousedown",outsideMenu),0);}
function outsideMenu(e){if(!e.target.closest("#cmenu")&&!e.target.closest(".dcell"))closeMenu();}
function closeMenu(){const m=document.getElementById("cmenu");if(m)m.remove();document.removeEventListener("mousedown",outsideMenu);MENU=null;}
function setDayF(i,date,f){const p=D.months[MES].pac[i];const v=p.dias[date]||{f:f,c:0};v.f=f;p.dias[date]=v;save();repaintCell(i,date);updSig(i);drawTot();if(MENU)openCellMenu(MENU.i,MENU.date,MENU.cellEl);}
function toggleDayCoag(i,date){const p=D.months[MES].pac[i];const v=p.dias[date];if(!v)return;v.c=v.c?0:1;save();repaintCell(i,date);updSig(i);drawTot();if(MENU)openCellMenu(MENU.i,MENU.date,MENU.cellEl);}
function clearDay(i,date){delete D.months[MES].pac[i].dias[date];save();repaintCell(i,date);updSig(i);drawTot();closeMenu();}

/* ---- shared edits ---- */
function drawTot(){const el=document.getElementById("totbar");if(!el)return;const r=calc(MES);const cz=r.dif===0;
  el.className="totbar";el.innerHTML=`
    <div class="tcard"><div class="k">Diálisis</div><div class="v mono">${r.dia}</div><div class="s">IESS ${r.diaI} · MSP ${r.diaM}</div></div>
    <div class="tcard"><div class="k">Pacientes</div><div class="v mono">${r.pac}</div><div class="s">IESS ${r.pI} · MSP ${r.pM}</div></div>
    <div class="tcard"><div class="k">Filtros</div><div class="v mono">${r.consumidos}</div><div class="s">${[17,18,19,20,21].filter(t=>r.f[t]).map(t=>t+"H "+r.f[t]).join(" \u00b7 ")||"\u2014"}</div></div>
    <div class="tcard"><div class="k">Facturado</div><div class="v mono" style="color:var(--brand-ink);font-size:19px">${money(r.fact)}</div><div class="s">IESS ${money(r.montoI)} · MSP ${money(r.montoM)}</div></div>
    <div class="tcard cuad ${cz?"ok":"bad"}"><div class="k">Cuadre</div><div class="v">${cz?"✓":(r.dif>0?"+"+r.dif:r.dif)}</div><div class="s">${r.dia} diál.${r.coag?" + "+r.coag+" coag":""} = ${r.esperados}</div></div>`;}
function updSig(i){const p=D.months[MES].pac[i];const s=sesOf(p),c=coagOf(p);const el=document.getElementById("sig-"+i);if(!el)return;
  el.innerHTML=VIEW==="dia"?`${s+c} filtros`:`${s+c} <span class="coagf">${c?("+"+c+" coag"):""}</span>`;}

function setN(i,v){D.months[MES].pac[i].n=v;save();}
function setSeg(i,v){D.months[MES].pac[i].seg=v;save();render();}
function setPat(i,v){const p=D.months[MES].pac[i];if(p.patron===v)return;p.patron=v;
  const keep=new Set(patternDays(MES,v).map(d=>d.date));const nd={};for(const k in p.dias)if(keep.has(k))nd[k]=p.dias[k];p.dias=nd;
  save();render();}
function setF(i,v){const p=D.months[MES].pac[i];const old=+p.filtro,nf=+v;p.filtro=nf;
  for(const k in p.dias){if(p.dias[k].f===old)p.dias[k].f=nf;}
  save();if(VIEW==="dia")render();else{updSig(i);drawTot();}}
function orderedPD(i){return patternDays(MES,D.months[MES].pac[i].patron).map(d=>d.date);}
function setSesCount(i,val){const p=D.months[MES].pac[i];const pd=orderedPD(i);let n=Math.max(0,Math.min(pd.length,Math.round(+val||0)));
  const nd={};for(let k=0;k<n;k++){const dt=pd[k];const ex=p.dias[dt];nd[dt]=ex?{f:ex.f,c:ex.c}:{f:+p.filtro,c:0};}p.dias=nd;save();refreshRow(i);drawTot();}
function setCoagCount(i,val){const p=D.months[MES].pac[i];const att=orderedPD(i).filter(dt=>p.dias[dt]);let c=Math.max(0,Math.min(att.length,Math.round(+val||0)));
  att.forEach((dt,idx)=>{p.dias[dt].c=(idx>=att.length-c)?1:0;});save();refreshRow(i);drawTot();}
function bumpSes(i,delta){const p=D.months[MES].pac[i];const pd=orderedPD(i);
  if(delta>0){for(const dt of pd)if(!p.dias[dt]){p.dias[dt]={f:+p.filtro,c:0};break;}}
  else{for(let k=pd.length-1;k>=0;k--)if(p.dias[pd[k]]){delete p.dias[pd[k]];break;}}
  save();refreshRow(i);drawTot();}
function bumpCoag(i,delta){const p=D.months[MES].pac[i];const att=orderedPD(i).filter(dt=>p.dias[dt]);
  if(delta>0){for(let k=att.length-1;k>=0;k--)if(p.dias[att[k]].c===0){p.dias[att[k]].c=1;break;}}
  else{for(let k=att.length-1;k>=0;k--)if(p.dias[att[k]].c===1){p.dias[att[k]].c=0;break;}}
  save();refreshRow(i);drawTot();}
function refreshRow(i){const p=D.months[MES].pac[i];const s=sesOf(p),c=coagOf(p);var row=document.getElementById("row-"+i);
  if(row){const ins=row.querySelectorAll("input[type=number]");if(ins[0])ins[0].value=s;if(ins[1])ins[1].value=c;}
  updSig(i);}
function addP(){D.months[MES].pac.push({n:"Nuevo paciente",seg:"MSP",patron:"LMV",filtro:19,dias:{}});save();render();}
function delP(i){const p=D.months[MES].pac[i];if(!confirm("¿Quitar a "+(p.n||"este paciente")+" de "+D.months[MES].label+"?"))return;
  D.months[MES].pac.splice(i,1);save();render();}

let INFV="mensual";
function setInfV(v){INFV=v;render();}
function viewInforme(){const tg=`<div class="tabs" style="margin-bottom:14px"><button class="tab ${INFV==="mensual"?"on":""}" onclick="setInfV('mensual')">Mensual</button><button class="tab ${INFV==="paciente"?"on":""}" onclick="setInfV('paciente')">Por paciente</button></div>`;return tg+(INFV==="mensual"?infMensual():infPaciente());}
function infPaciente(){const x=D.months[MES];let tI=0,tM=0,dI=0,dM=0,fTot=0;
  const rows=x.pac.map((p,i)=>{const s=sesOf(p),c=coagOf(p),b=bill(s),fil=s+c;
    if(p.seg==="IESS"){tI+=b;dI+=s;}else{tM+=b;dM+=s;}fTot+=fil;return {i,p,s,c,b,fil};});
  const body=rows.map(o=>`<tr><td class="r">${o.i+1}</td><td>${o.p.n}</td><td>${o.p.seg}</td><td class="r">${o.s}</td><td class="r">${o.fil}${o.c?` <span style="color:var(--amber);font-size:11px">(${o.c}c)</span>`:""}</td><td class="r">${money(o.b)}</td></tr>`).join("");
  return `<div class="informe">
    <div class="inf-head"><div class="inf-ey">Detalle por paciente</div><h2>RenalVida S.A.</h2><div class="d">${D.months[MES].label}</div></div>
    <table class="itbl"><thead><tr><th class="r">Nº</th><th>Paciente</th><th>Seguro</th><th class="r">Diálisis</th><th class="r">Filtros</th><th class="r">Monto $</th></tr></thead>
      <tbody>${body}
        <tr class="tot"><td></td><td>TOTAL · ${rows.filter(o=>o.s>0).length} pctes.</td><td></td><td class="r">${dI+dM}</td><td class="r">${fTot}</td><td class="r">${money(tI+tM)}</td></tr>
      </tbody></table>
    <p class="inf-note">Facturación: <b>12 diálisis o más = paquete $1.456</b>; menos de 12 = <b>$112 por diálisis</b>. "c" = filtros coagulados incluidos en el total.</p>
    <div class="sign"><div class="sign-b"><div class="sign-line"></div><div class="sign-n">David Quintana</div><div class="sign-r">Téc. diálisis</div></div>
      <div class="sign-b"><div class="sign-line"></div><div class="sign-n">Fernando Alay</div><div class="sign-r">Administrador</div></div></div>
    <button class="printbtn" onclick="window.print()">Imprimir / Guardar PDF</button></div>`;
}
function infMensual(){const r=calc(MES);const cz=r.dif===0;
  const cuad=cz?`<div class="cuadre ok"><svg viewBox="0 0 24 24">${ICcheck}</svg><div>Conciliación correcta: ${r.consumidos} filtros = ${r.dia} diálisis${r.coag?` + ${r.coag} coagulados`:""}.</div></div>`
    :`<div class="cuadre bad"><svg viewBox="0 0 24 24">${ICwarn}</svg><div>Diferencia de ${r.dif>0?"+":""}${r.dif}: filtros ${r.consumidos}, esperados ${r.esperados}.</div></div>`;
  return `<div class="informe">
    <div class="inf-head"><div class="inf-ey">Informe de diálisis realizadas</div><h2>RenalVida S.A.</h2><div class="d">${D.months[MES].label}</div></div>
    <table class="itbl"><caption>Facturación</caption>
      <thead><tr><th>Seguro</th><th class="r">Nº pctes.</th><th class="r">Nº diálisis</th><th class="r">Monto $</th></tr></thead><tbody>
        <tr><td>IESS · HD</td><td class="r">${r.pI}</td><td class="r">${r.diaI}</td><td class="r">${money(r.montoI)}</td></tr>
        <tr><td>MSP · HD</td><td class="r">${r.pM}</td><td class="r">${r.diaM}</td><td class="r">${money(r.montoM)}</td></tr>
        <tr class="tot"><td>Facturado</td><td class="r">${r.pac}</td><td class="r">${r.dia}</td><td class="r">${money(r.fact)}</td></tr></tbody></table>
    <table class="itbl"><caption>Filtros</caption><thead><tr><th>Tipo</th><th class="r">Cantidad</th></tr></thead><tbody>
        <tr><td>Filtros de 17H</td><td class="r">${r.f[17]}</td></tr>
        <tr><td>Filtros de 18H</td><td class="r">${r.f[18]}</td></tr>
        <tr><td>Filtros de 19H</td><td class="r">${r.f[19]}</td></tr>
        <tr><td>Filtros de 20H</td><td class="r">${r.f[20]}</td></tr>
        <tr><td>Filtros de 21H</td><td class="r">${r.f[21]}</td></tr>
        <tr class="tot"><td>Total</td><td class="r">${r.consumidos}</td></tr>
        <tr><td>Coagulados</td><td class="r">${r.coag}</td></tr></tbody></table>
    ${cuad}
    <p class="inf-note">El total de filtros se obtiene sumando, por cada paciente, sus sesiones según el tipo de filtro. Un filtro coagulado suma una unidad extra. Regla: <b>filtros = diálisis + coagulados</b>.<br>Facturación: <b>12 diálisis o más = paquete $1.456</b>; menos de 12 = <b>$112 por diálisis</b>.</p>
    <div class="sign"><div class="sign-b"><div class="sign-line"></div><div class="sign-n">David Quintana</div><div class="sign-r">Téc. diálisis</div></div>
      <div class="sign-b"><div class="sign-line"></div><div class="sign-n">Fernando Alay</div><div class="sign-r">Administrador</div></div></div>
    <button class="printbtn" onclick="window.print()">Imprimir / Guardar PDF</button></div>`;
}
function toast(msg){let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;opacity:0;transition:opacity .25s;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center";}
  t.textContent=msg;t.style.opacity="1";clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.opacity="0",2600);}

function startApp(){
  loadLocal();initMES();render();
  var hasLocal=false;try{hasLocal=!!localStorage.getItem(LSKEY);}catch(e){}
  if(HASBK&&!hasLocal){pullFromDrive(true);}else{setSync("idle");}
}
function pullFromDrive(silent){if(!HASBK)return;setSync("sync");
  gasGet(function(d){
    if(d&&d.order&&d.order.length){D=d;initMES();render();_dirty={};setSync("ok");}
    else{setSync(silent?"idle":"err");}
  });}
startApp();
</script></body></html>
